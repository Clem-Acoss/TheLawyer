services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: thelawyer-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    dns:
      - 172.25.16.1
    volumes:
      - ./rag_state:/app/rag_state
    environment:
      http_proxy: "http://proxy-web.service.cnp.cs.recouv:3128"
      https_proxy: "http://proxy-web.service.cnp.cs.recouv:3128"
      HTTP_PROXY: "http://proxy-web.service.cnp.cs.recouv:3128"
      HTTPS_PROXY: "http://proxy-web.service.cnp.cs.recouv:3128"

  db:
    image: postgres:16
    container_name: thelawyer-db
    restart: always
    environment:
      POSTGRES_DB: baseTheLawyer
      POSTGRES_USER: clementgardair
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:

      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
